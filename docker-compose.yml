services:
  # Integrationens egen databas (statustabellen)
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Affärssystemets databas – ett separat system, därför en egen databasserver
  erp-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${ERP_DB_USER}
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD}
      POSTGRES_DB: ${ERP_DB_NAME}
    volumes:
      - erp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Mini-ERP: REST-API på http://localhost:8001 (testsida på /docs)
  mini-erp:
    build: ./mini-erp
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://${ERP_DB_USER}:${ERP_DB_PASSWORD}@erp-db:5432/${ERP_DB_NAME}
      ERP_API_KEY: ${ERP_API_KEY}
      ERP_FAILURE_MODE: ${ERP_FAILURE_MODE:-none}
      ERP_SLOW_SECONDS: ${ERP_SLOW_SECONDS:-10}
    ports:
      - "8001:8000"
    depends_on:
      erp-db:
        condition: service_healthy

  # Kön. Webbgränssnitt på http://localhost:15672
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Integrationstjänsten: tar emot webhooks på http://localhost:8000
  integration:
    build: ./integration
    restart: unless-stopped
    environment:
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      INTEGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INTEGRATION_ADMIN_KEY: ${INTEGRATION_ADMIN_KEY}
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

  # Workern: hämtar ordrar från kön och skickar dem till mini-ERP:t
  worker:
    build: ./integration
    command: ["python", "-m", "app.worker"]
    # Kraschar workern startas den om, och ordern den höll på med levereras igen.
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ERP_URL: http://mini-erp:8000
      ERP_API_KEY: ${ERP_API_KEY}
      INTEGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      mini-erp:
        condition: service_started

volumes:
  db-data:
  erp-db-data:
  rabbitmq-data:
